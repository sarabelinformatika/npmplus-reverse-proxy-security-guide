name: Validate documentation and examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Validate shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate YAML
        run: |
          ruby -e 'require "yaml"; Dir["**/*.{yml,yaml}"].each { |f| YAML.load_stream(File.read(f)); puts "OK #{f}" }'

      - name: Check for committed secret files
        run: |
          if find . -type f \( -name '.env' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .; then
            echo 'Potential secret file committed.' >&2
            exit 1
          fi
